name: verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  prototype-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bash scripts/verify.sh
