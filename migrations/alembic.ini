# CampaignLab Alembic 配置（M0-02 · S2 首迁）。
#
# 调用方式（任务卡 gates / 设计档 §5 V3 的原文命令）：
#   alembic -c migrations/alembic.ini upgrade head
#
# script_location 用 %(here)s 而不是相对路径：alembic 以 -c migrations/alembic.ini 调用时
# cwd 仍是仓库根，%(here)s 由 alembic 展开为本 ini 所在目录，避免「相对 cwd」与
# 「相对 ini」两种解释打架（alembic init 的默认注释亦如此说明）。
[alembic]
script_location = %(here)s
version_locations = %(here)s/versions
path_separator = os
prepend_sys_path = .
output_encoding = utf-8

# 版本号由迁移文件自身声明（revision = "0001_initial_schema"），文件名沿用同一串，
# 便于 Health.schema_revision 与磁盘文件双向对账。
file_template = %%(rev)s

# sqlalchemy.url 故意留空：真实连接串由 env.py 按
#   -x db_path=... / set_main_option > CAMPAIGNLAB_DATABASE_URL
#   > CAMPAIGNLAB_DATA_DIR/state/campaignlab.db > ~/.local/share/campaignlab/state/campaignlab.db
# 的优先级解析。禁止在此写死路径（D-004：禁硬编码取数依据）。
sqlalchemy.url =

# 首迁是手写 SQL：SQLite 的 STRICT 表、复合外键、部分唯一索引（cases_one_confirmed_child）
# 都无法由 SQLAlchemy 的 DDL 编译器表达，故不做 autogenerate，也不需要 target_metadata。
# env.py 刻意不 import campaignlab —— 迁移必须能在裸环境下独立复现（AC-035）。

[post_write_hooks]
# 不挂钩子：migrations/** 的格式化与 lint 由仓库根 ruff format / ruff check 统一负责。

# ---- 日志：沿用 alembic init 生成的默认段落（format/datefmt 的 % 不转义，
#      因为该段由 logging.config.fileConfig 读取，而非 alembic 的 ConfigParser 插值）----
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
