<script>
function tracebar(){
  var N=["语义","规划","映射","SQL","校验","解释"];
  return '<div class="tracebar"><span class="tb-t"><span class="aimark">AI</span>受控链路 6/6</span>'
    +N.map(function(n,i){var now=i===5;return '<span class="nd'+(now?" now":"")+'"><i>'+(now?"●":(i+1))+'</i>'+n+'</span>';}).join("")
    +'<span class="exp">轨迹 ▾</span></div>';
}
function para(){
  var G='<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">';
  var M=' style="margin-bottom:0"';
  return '<div class="handoff">'
   +'<div class="seg4 danger"><div class="h"><span class="n">1</span><span class="t">指标判断 · 发生了什么</span>'+stTag("WARN")+'</div><div class="b">'
   +'有效触达 <b class="num">1,728</b>／基准 <b class="num">1,920</b>，差 <b class="num" style="color:var(--danger-700)">−192（−10.0%）</b><span class="ref">1</span>；触达率 <b class="num">15.0%</b>（−1.8pp）触发 THR-07<span class="ref">3</span>。</div></div>'
   +G
   +'<div class="seg4"'+M+'><div class="h"><span class="n">2</span><span class="t">结构拆解</span><span class="tag sys">结构</span></div><div class="b">新客占比 41%→47% 下沉；华东 −0.9pp 最大；企微<b>部分可比</b>。</div></div>'
   +'<div class="seg4"'+M+'><div class="h"><span class="n">3</span><span class="t">归因分析</span><span class="tag ai">归因</span></div><div class="b">名单执行 −0.8pp/44% ＞ 客群 −0.6pp/33% ＞ 渠道 −0.5pp/28%<span class="ref">2</span>。</div></div>'
   +'</div>'
   +'<div class="seg4"><div class="h"><span class="n">4</span><span class="t">决策建议</span><span class="tag ok">可执行</span></div><div class="b">① 补发失败名单；② 新客单设阈值；③ 华东按可比子集重算。</div></div>'
   +'</div>';
}
function artcard(){
  return '<div class="artcard"><span class="ac-ico">归</span>'
   +'<div class="ac-tt"><b>有效触达下降 · 归因分析</b><small>artifact://ATTR-202610-01 · v1 · RUN-1121-03</small></div>'
   +'<span class="ac-st">已在画布打开 · 图表同步 ↗</span></div>'
   +'<div class="ainote">归因分析已在右侧<b>嵌入画布</b>打开：三图与结论同构（引用 1、2），可一键插入报告 §3。</div>';
}
function canvas(){
  var MK=function(l,v,d,cls){return '<div class="mk"><span class="l">'+l+'</span><b class="num">'+v+'</b><span class="d '+(cls||"")+'">'+d+'</span></div>';};
  return '<div class="colx thin" style="min-height:0;display:flex">'
   +'<section class="card artwrap">'
     +'<div class="art-h"><span class="art-ico">归</span>'
       +'<div class="art-tt"><b>有效触达下降 · 归因分析</b><small>artifact://ATTR-202610-01</small></div>'
       +'<div class="art-ver"><span class="v on">v1</span><span class="vl">1/1</span></div>'
       +'<div class="sp"></div><span class="mini2" title="复制编号">⧉</span><span class="mini2" title="全屏打开">⤢</span><span class="mini2" title="关闭画布">✕</span></div>'
     +'<div class="art-tabs"><span class="tab on">分析预览</span><span class="tab">查询计划</span><span class="tab">证据 3</span><div class="sp"></div><span class="tag ai">AI 归因 · 只读</span></div>'
     +'<div class="art-frame">'
       +'<div class="art-bar"><span class="url">artifact://ATTR-202610-01/v1 · 嵌入预览</span><div class="sp"></div><span class="mini2" title="刷新">↻</span><span class="mini2" title="新窗口打开">⤢</span></div>'
       +'<div class="art-doc v2scroll">'
         +'<div class="doc-t">为什么下降？· 归因分析<span class="tag warn">THR-07 触发</span></div>'
         +'<div class="doc-chips"><span class="chip info">期间 2026-10</span><span class="chip">基准 16.8%</span><span class="chip">快照 snap-20261031</span><span class="chip">可比子集 98.2%</span></div>'
         +'<div class="dsec"><div class="ds-h"><i style="background:var(--brand-600)"></i>下降了多少<span class="mono-s">4 项 KPI</span></div>'
           +'<div class="mkgrid">'
             +MK("有效触达","1,728","基准 1,920 · −192","dn")
             +MK("触达率","15.0%","基准 16.8% · −1.8pp","dn")
             +MK("名单执行率","71%","基准 78% · −7pp","dn")
             +MK("最大区域降幅","华东","−0.9pp · 待重算","dw")
           +'</div></div>'
         +'<div class="dsec"><div class="ds-h"><i style="background:var(--ink-700)"></i>一句话结论<span class="mono-s">直接回答本问</span></div>'
           +'<div class="dlist">① 下降真实且超阈值：−192 人／−1.8pp，触发 THR-07；② 主因在<b>执行层</b>：名单执行率 78%→71% 贡献 44%，非策略本身；③ 渠道看<b>企微</b>（−96，部分可比）、客群看<b>新客稀释</b>（占比 47%、触达率仅 9.8%）。</div></div>'
         +'<div class="dsec"><div class="ds-h"><i style="background:var(--ai-500)"></i>为什么降 · 贡献瀑布（pp）<span class="mono-s">引用 2</span></div>'
           +AIC.waterfall([{l:"基准",sub:"16.8%",type:"tot",from:12,to:16.8,tot:"16.8"},
                            {l:"名单执行",sub:"44%",type:"neg",from:16.8,to:16.0},
                            {l:"客群结构",sub:"33%",type:"neg",from:16.0,to:15.4},
                            {l:"渠道覆盖",sub:"28%",type:"neg",from:15.4,to:14.9},
                            {l:"其他",sub:"−5%",type:"pos",from:14.9,to:15.0},
                            {l:"本期",sub:"15.0%",type:"tot",from:12,to:15.0,tot:"15.0"}],{w:486,h:150,min:12,max:18})
           +'<div class="chartcap">四因子合计 = −1.8pp，闭合校验通过；「其他」为正向余量。观察结果不构成因果结论。</div>'
         +'</div>'
         +'<div class="dsec"><div class="ds-h"><i style="background:var(--ai-500)"></i>哪个渠道 · 贡献（触达数 vs 基准）<span class="mono-s">引用 4</span></div>'
           +AIC.divbars([{l:"企微",v:-96,t:"−96"},{l:"短信",v:-52,t:"−52"},{l:"外呼",v:-31,t:"−31"},{l:"App 推送",v:14,t:"+14"}],{w:486,rh:23,pl:64,pr:48,max:100})
           +'<div class="chartcap">企微缺口最大但处覆盖恢复期（部分可比）；App 推送为正贡献。</div>'
         +'</div>'
         +'<div class="dsec"><div class="ds-h"><i style="background:var(--ai-500)"></i>哪个客群 · 触达率（%）<span class="mono-s">引用 2</span></div>'
           +hbars([{l:"优客",v:21.4,t:"21.4",c:"#003bb3"},{l:"存客",v:18.2,t:"18.2",c:"#0048d8"},{l:"普客",v:12.6,t:"12.6",c:"#3368e0"},{l:"新客",v:9.8,t:"9.8",c:"#6a5af9"}],{w:486,rh:23,pl:52,pr:44,max:24})
           +'<div class="chartcap">新客占比 41%→47% 而触达率仅 9.8%，结构性稀释 −0.6pp。</div>'
         +'</div>'
         +'<div class="dsec"><div class="ds-h"><i style="background:var(--ink-400)"></i>证据与运行<span class="mono-s">RUN-1121-03 · 12s · 校验 PASS</span></div>'
           +'<div class="doc-chips" style="margin:0"><span class="chip">EVD-1031-01</span><span class="chip">EVD-1031-02</span><span class="chip">EVD-1031-04</span><span class="chip info">M_REACH_RATE v3</span></div></div>'
       +'</div>'
     +'</div>'
     +'<div class="art-f"><span class="tiny">3 图表 · 3 引用 · 与对话结论同构</span><div class="sp"></div><button class="btn btn-sm">导出</button><button class="btn btn-p btn-sm">插入报告 §3</button></div>'
   +'</section></div>';
}
function viewA2(){
  return '<div class="screen" style="flex:1;min-height:0;display:block">'
   +'<div class="ws-ai ws-ai--2b">'
   +'<div class="colx"><section class="card" style="flex:1;min-height:0;display:flex;flex-direction:column">'
     +'<div class="cvhead"><span class="aimark">AI</span><span class="t">复盘对话 · 2026-10 月度复盘</span><span class="meta">上下文：期间 2026-10 · 机构 全行 · 口径 v3</span><div class="sp"></div><span class="chip info">画布：归因分析 v1</span></div>'
     +'<div class="feed thin" style="gap:10px;padding:8px 14px">'
       +'<div class="msg u"><div class="av">张</div><div class="bd"><div class="who">张三 · 分行运营 <span class="num">09:12</span></div><div class="bub">本月有效触达为什么下降？主要受哪个渠道和客群影响？</div></div></div>'
       +'<div class="msg a"><div class="av">AI</div><div class="bd"><div class="who"><span class="aimark">AI</span>复盘智能体 · 命中指标对象 3 · 校验 PASS</div>'
         +'<div class="bub">'+tracebar()+para()+artcard()
           +'<div class="follow"><span class="fq">那车贷渠道呢</span><span class="fq">只看华东分行</span><span class="fq">拆到支行层级</span><span class="fq">§3 插入并签认</span></div>'
         +'</div></div></div>'
     +'</div>'
     +'<div class="composer"><div class="cbox">'
       +'<div class="ctx"><span class="chip info">期间 2026-10</span><span class="chip info">机构 全行</span><span class="chip info">口径 v3</span><span class="chip">快照 snap-20261031</span></div>'
       +'<div class="in"><span class="ph">继续追问，或输入新的复盘问题…<span class="cur"></span></span></div>'
       +'<div class="tools"><span class="tool" title="附件">⎘</span><span class="tool" title="指标对象">@</span><span class="tool" title="证据">◆</span>'
         +'<span class="mode">◈ 深度复盘</span><span class="chip" style="height:24px">快速问数</span><span class="chip" style="height:24px">情景试算</span>'
         +'<div class="sp"></div><button class="send">➤</button></div>'
     +'</div></div>'
   +'</section></div>'
   +canvas()
   +'</div></div>';
}
YX.init({start:"a2",hooks:{afterRender:function(){var pb=document.getElementById("pagebar");if(pb)pb.style.display=(YX.current==="a2")?"none":"";}},views:{a2:{title:"复盘对话",sub:"",group:"g1",segs:[["a2","A2","复盘对话"]],fn:viewA2}}});
